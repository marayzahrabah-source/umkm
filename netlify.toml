[build]
  command = "npm run build"

[build.environment]
  # NEXT_PUBLIC_* variables are intentionally inlined into the browser bundle by Next.js.
  # The Supabase URL and anon key are public by design (data is protected by RLS),
  # so they are excluded from secrets scanning. SUPABASE_SERVICE_ROLE_KEY is still scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_URL"
